version: 2

models:
  - name: int_airbnb__listings_cleaned
    description: >
      Cleaned table containing locations available to book. If 'minimum_nights' equals 0, then it is replaced to 1. Each row is one location.
    data_tests:
      - minimum_row_count:
          arguments:
            min_row_count: 100
          severity: error
    columns:
      - name: listing_id
        data_type: int64
        description: >
          Unique ID of each listing.
        data_tests:
          - unique
          - not_null

      - name: listing_url
        data_type: string
        description: >
          URL link which directs to listing offer.

      - name: listing_name
        data_type: string
        description: >
          Listing's name

      - name: room_type
        data_type: string
        description: >
          Type of listing.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  [
                    "Hotel room",
                    "Private room",
                    "Entire home/apt",
                    "Shared room",
                  ]

      - name: minimum_nights
        data_type: int64
        description: >
          {{ doc('int_airbnb__listings_cleaned__minimum_nights') }}
        data_tests:
          - positive_values

      - name: host_id
        data_type: int64
        description: >
          Reference to host offering a listing.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_airbnb__hosts_cleaned')
                field: host_id

      - name: price
        data_type: int64
        description: >
          Price per night.

      - name: created_at
        data_type: timestamp
        description: >
          Listing creation date.

      - name: updated_at
        data_type: timestamp
        description: >
          Last modification date.
