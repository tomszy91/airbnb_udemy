name: PR slim CI (defer to prod artifact)

on:
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read
  actions: read

jobs:
  slim-ci:
    name: Build modified with defer to prod artifact
    runs-on: ubuntu-latest
    
    env:
      DBT_PROFILES_DIR:     ${{ github.workspace }}/ci
      GCS_BUCKET:           ${{ secrets.GCS_BUCKET }}
      CONTAINER_IMAGE:      ${{ secrets.CONTAINER_IMAGE }}
      BQ_DATASET:           ${{ secrets.BQ_DATASET }}
      BQ_PROJECT:           ${{ secrets.BQ_PROJECT }}

    steps:
      - name: repository checkout
        uses: actions/checkout@v4.2.2

      - name: python setup
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: dbt install
        run: |
          pip install dbt-core==1.10.8 dbt-bigquery==1.10.0

      - name: Write GCP credentials
        env:
          GCP_SA_KEY_B64: ${{ secrets.GCP_SA_KEY_B64 }}
        run: echo "$GCP_SA_KEY_B64" | base64 -d > /tmp/gcp-key.json

      - name: Set DBT_ENV_NAME from branch
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          SANITIZED=$(echo "$BRANCH" | tr -c 'A-Za-z0-9_\n' '_' | tr '[:lower:]' '[:lower:]')
          echo "DBT_ENV_NAME=$SANITIZED" >> "$GITHUB_ENV"
          echo "PR will build into schema: dbt_$SANITIZED"

      - name: dbt packages install
        run: |
          dbt deps

      - name: Download latest prod-target artifact from main
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: prod_build.yml
          branch: main
          name: prod-target
          path: prod-target
          if_no_artifact_found: fail
      - name: dbt build (slim CI if manifest available, else full)
        run: dbt build  --target dev --select state:modified+ --defer --state ./prod-target