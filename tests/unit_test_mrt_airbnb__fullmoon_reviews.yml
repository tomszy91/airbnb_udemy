unit_tests:
  - name: unit_test_mrt_airbnb__fullmoon_reviews
    model: mrt_airbnb__fullmoon_reviews

    given:
      - input: ref("int_airbnb__reviews_cleaned")
        rows:
          - {review_date: '2025-01-13'}
          - {review_date: '2025-01-14'}
          - {review_date: '2025-01-15'}
      - input: ref("seed_full_moon_dates")
        rows:
          - {full_moon_date: '2025-01-14'}

    expect:
      rows:
        - {review_date: '2025-01-13', is_full_moon: false}
        - {review_date: '2025-01-14', is_full_moon: false}
        - {review_date: '2025-01-15', is_full_moon: true}
